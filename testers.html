<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Gecko Climb – Become a tester</title>
<link rel="icon" href="img/icon.png">
<style>
  :root { --bg: #1d1b3a; --card: #2f2c58; --ink: #fbf8ff; --ink2: #cfc9ea; --accent: #7cf29a; --warn: #ff8a5b; --line: #433f7a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px 56px; }
  .card { background: var(--card); border-radius: 22px; padding: 22px; }
  img.tex { display: block; width: 120px; margin: 0 auto 8px; }
  h1 { font-size: 26px; margin: 0 0 6px; text-align: center; }
  p { color: var(--ink2); margin: 6px 0 14px; }
  label { display: block; font-size: 13px; color: var(--ink2); margin: 14px 0 6px; }
  input, select, textarea { width: 100%; font: inherit; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink2); margin-top: 16px; }
  .check input { width: 22px; height: 22px; margin: 2px 0 0; flex: none; }
  button { width: 100%; margin-top: 18px; border: 0; border-radius: 16px; height: 52px; font: 700 18px inherit; background: var(--accent); color: #0d3b1d; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 14px; min-height: 22px; } .err { color: var(--warn); } .ok { color: var(--accent); }
  .hp { position: absolute; left: -9999px; height: 0; overflow: hidden; }
  .lang { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 4px; }
  .lang button { width: auto; height: 34px; margin: 0; padding: 0 14px; border-radius: 12px; font-size: 14px; background: var(--bg); color: var(--ink2); border: 2px solid var(--line); }
  .lang button.on { background: var(--accent); color: #0d3b1d; border-color: var(--accent); }
  a { color: var(--accent); } ul { color: var(--ink2); padding-left: 20px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="hu">HU</button></div>
    <img class="tex" src="img/tex.png" alt="Tex, the Gecko Climb gecko, giving a thumbs up">
    <h1 data-t="h1"></h1>
    <p data-t="intro"></p>
    <ul>
      <li data-t="li1"></li>
      <li data-t="li2"></li>
      <li data-t="li3"></li>
    </ul>
    <form id="f">
      <label for="email" data-t="lblEmail"></label>
      <input id="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="phone" data-t="lblPhone"></label>
      <select id="phone"><option value="" data-t="optChoose"></option><option value="android" data-t="optAndroid"></option><option value="iphone" data-t="optIphone"></option><option value="both" data-t="optBoth"></option></select>
      <label for="note" data-t="lblNote"></label>
      <textarea id="note" rows="3" maxlength="300" data-ph="phNote"></textarea>
      <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" tabindex="-1" autocomplete="off"></div>
      <label class="check"><input id="ok" type="checkbox"><span><span data-t="consent"></span> <a href="privacy.html" data-t="privacy"></a></span></label>
      <button id="go" type="submit" data-t="go"></button>
    </form>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </div>
  <p><a href="index.html">&larr; Gecko Climb</a></p>
</main>
<script src="supabase.js"></script>
<script src="cloud-config.js"></script>
<script src="testers.js"></script>
</body>
</html>
